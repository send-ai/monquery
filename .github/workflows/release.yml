# Publishes to npm when a version tag is pushed, using npm trusted publishing (OIDC).
# One-time setup on npmjs.com: package settings -> Trusted publishers -> GitHub Actions,
# repository "send-ai/monquery", workflow "release.yml". No npm token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
